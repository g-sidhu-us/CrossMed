[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossmed"
version = "0.1.0"
description = "Cross-dataset breast ultrasound classification benchmark"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.scripts]
crossmed-prepare = "crossmed.prepare:main"
crossmed-train = "crossmed.train:main"
crossmed-evaluate = "crossmed.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

