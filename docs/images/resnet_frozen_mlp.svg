<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#496078"/></marker><style>text{font-family:Arial,sans-serif;fill:#17263a}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#496078}.h{font-size:19px;font-weight:700}.b{font-size:15px}.box{stroke-width:2;rx:16}.arrow{stroke:#496078;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="400" fill="#f6f8fb"/>
  <text x="55" y="48" class="title">Architecture B — Frozen ResNet + Notebook MLP Head</text>
  <text x="55" y="76" class="sub">The same trainable classifier is evaluated with ResNet-18, ResNet-50, and ResNet-101 feature extractors</text>
  <rect x="45" y="145" width="155" height="110" class="box" fill="#e8f1ff" stroke="#3b78c8"/>
  <text x="123" y="187" class="h" text-anchor="middle">Preprocessed</text><text x="123" y="216" class="b" text-anchor="middle">3 × 224 × 224</text>
  <line x1="200" y1="200" x2="250" y2="200" class="arrow"/>
  <rect x="255" y="120" width="250" height="160" class="box" fill="#e8edf3" stroke="#68798c"/>
  <text x="380" y="163" class="h" text-anchor="middle">Frozen ResNet</text><text x="380" y="192" class="b" text-anchor="middle">18: 512-D</text><text x="380" y="216" class="b" text-anchor="middle">50 / 101: 2048-D</text><text x="380" y="250" class="b" text-anchor="middle">EVAL MODE • NO GRADIENTS</text>
  <line x1="505" y1="200" x2="555" y2="200" class="arrow"/>
  <rect x="560" y="145" width="155" height="110" class="box" fill="#e7f7ef" stroke="#269365"/>
  <text x="638" y="184" class="h" text-anchor="middle">Global Avg.</text><text x="638" y="210" class="h" text-anchor="middle">Pooling</text><text x="638" y="235" class="b" text-anchor="middle">no parameters</text>
  <line x1="715" y1="200" x2="765" y2="200" class="arrow"/>
  <rect x="770" y="135" width="180" height="130" class="box" fill="#fff3dd" stroke="#d58a18"/>
  <text x="860" y="179" class="h" text-anchor="middle">Linear → 256</text><text x="860" y="207" class="b" text-anchor="middle">ReLU</text><text x="860" y="232" class="b" text-anchor="middle">BatchNorm</text>
  <line x1="950" y1="200" x2="1000" y2="200" class="arrow"/>
  <rect x="1005" y="145" width="155" height="110" class="box" fill="#fff3dd" stroke="#d58a18"/>
  <text x="1083" y="190" class="h" text-anchor="middle">Dropout</text><text x="1083" y="219" class="b" text-anchor="middle">p = 0.2</text>
  <line x1="1160" y1="200" x2="1210" y2="200" class="arrow"/>
  <rect x="1215" y="145" width="150" height="110" class="box" fill="#f5eaff" stroke="#8454bd"/>
  <text x="1290" y="184" class="h" text-anchor="middle">Linear 256 → 2</text><text x="1290" y="213" class="b" text-anchor="middle">Benign /</text><text x="1290" y="236" class="b" text-anchor="middle">Malignant</text>
  <text x="55" y="352" class="sub">Only the orange and purple classifier blocks are trained; backbone BatchNorm statistics remain fixed.</text>
</svg>
