<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#496078"/></marker><style>text{font-family:Arial,sans-serif;fill:#17263a}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#496078}.h{font-size:19px;font-weight:700}.b{font-size:15px}.box{stroke-width:2;rx:16}.arrow{stroke:#496078;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="420" fill="#f6f8fb"/>
  <text x="55" y="48" class="title">Architecture C — Frozen ViT-B/16 + Notebook MLP Head</text>
  <text x="55" y="76" class="sub">ViT supplies a CLS representation; unlike the CNN models, no global-average-pooling block is used</text>
  <rect x="40" y="155" width="145" height="110" class="box" fill="#e8f1ff" stroke="#3b78c8"/>
  <text x="113" y="198" class="h" text-anchor="middle">Input</text><text x="113" y="227" class="b" text-anchor="middle">224 × 224 × 3</text>
  <line x1="185" y1="210" x2="230" y2="210" class="arrow"/>
  <rect x="235" y="145" width="170" height="130" class="box" fill="#e7f7ef" stroke="#269365"/>
  <text x="320" y="190" class="h" text-anchor="middle">16 × 16 patches</text><text x="320" y="219" class="b" text-anchor="middle">14 × 14 grid</text><text x="320" y="244" class="b" text-anchor="middle">196 tokens + CLS</text>
  <line x1="405" y1="210" x2="450" y2="210" class="arrow"/>
  <rect x="455" y="125" width="245" height="170" class="box" fill="#e8edf3" stroke="#68798c"/>
  <text x="578" y="170" class="h" text-anchor="middle">Frozen ViT-B/16</text><text x="578" y="201" class="b" text-anchor="middle">12 Transformer blocks</text><text x="578" y="227" class="b" text-anchor="middle">768-D CLS vector</text><text x="578" y="260" class="b" text-anchor="middle">EVAL MODE • NO GRADIENTS</text>
  <line x1="700" y1="210" x2="755" y2="210" class="arrow"/>
  <rect x="760" y="145" width="190" height="130" class="box" fill="#fff3dd" stroke="#d58a18"/>
  <text x="855" y="190" class="h" text-anchor="middle">Linear 768 → 256</text><text x="855" y="218" class="b" text-anchor="middle">ReLU</text><text x="855" y="243" class="b" text-anchor="middle">BatchNorm</text>
  <line x1="950" y1="210" x2="1000" y2="210" class="arrow"/>
  <rect x="1005" y="155" width="145" height="110" class="box" fill="#fff3dd" stroke="#d58a18"/>
  <text x="1078" y="200" class="h" text-anchor="middle">Dropout</text><text x="1078" y="229" class="b" text-anchor="middle">p = 0.2</text>
  <line x1="1150" y1="210" x2="1200" y2="210" class="arrow"/>
  <rect x="1205" y="155" width="155" height="110" class="box" fill="#f5eaff" stroke="#8454bd"/>
  <text x="1283" y="194" class="h" text-anchor="middle">Linear 256 → 2</text><text x="1283" y="223" class="b" text-anchor="middle">Benign /</text><text x="1283" y="246" class="b" text-anchor="middle">Malignant</text>
  <text x="55" y="365" class="sub">Only the MLP classifier is trained; patch embedding, attention blocks, positional embeddings, and CLS processing remain frozen.</text>
</svg>
